[package]
name = "vpscontrolpanel"
version = "0.1.0"
description = "Unified Server-Ops Cockpit"
authors = ["you"]
edition = "2021"

[lib]
name = "vpscontrolpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
dirs = "5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
iota_stronghold = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
russh = { version = "0.54", default-features = false, features = ["flate2", "rsa", "aws-lc-rs"] }
russh-keys = "0.43"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
russh = { version = "0.54", default-features = false, features = ["flate2", "ring"] }

[profile.dev.package.scrypt]
opt-level = 3
